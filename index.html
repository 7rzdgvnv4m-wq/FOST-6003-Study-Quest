function start(m){let b=Q;if(m==='quick')b=sh(Q).slice(0,20);else if(m==='weak'){let ids=JSON.parse(localStorage.getItem('fost6003missed')||'[]');b=Q.filter((x,n)=>ids.includes(n));if(!b.length){alert('No saved weak spots yet 💗');return}}else if(m!=='full')b=Q.filter(x=>x.t===m);deck=sh(b);i=score=xp=streak=0;hearts=5;missed=[];home.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');render()}
function render(){if(i>=deck.length||hearts<=0)return finish();let q=deck[i];count.textContent=`Question ${i+1} of ${deck.length}`;bar.style.width=(i/deck.length*100)+'%';topic.textContent=q.t;question.textContent=q.q;answers.innerHTML='';fb.className='hidden';next.classList.add('hidden');sh(q.o.map((v,n)=>({v,n}))).forEach(z=>{let b=document.createElement('button');b.className='ans';b.textContent=z.v;b.onclick=()=>choose(z.n,b);answers.appendChild(b)});stats()}
function choose(n,b){document.querySelectorAll('.ans').forEach(x=>x.disabled=true);let q=deck[i];document.querySelectorAll('.ans').forEach(x=>{if(x.textContent===q.o[q.a])x.classList.add('correct')});fb.className='explain';if(n===q.a){score++;streak++;let g=10+Math.min(streak,5)*2;xp+=g;fb.innerHTML=`<b>Correct! 💗 +${g} XP</b><br>${q.e}`}else{hearts--;streak=0;b.classList.add('wrong');missed.push(q);fb.innerHTML=`<b>Not quite 💞</b><br><b>Correct:</b> ${q.o[q.a]}<br>${q.e}`}next.classList.remove('hidden');stats()}
function stats(){h.textContent=hearts;document.getElementById('xp').textContent=xp;s.textContent=streak;l.textContent=Math.floor(xp/100)+1}function nextQ(){i++;render()}
function finish(){game.classList.add('hidden');result.classList.remove('hidden');let done=Math.max(1,Math.min(i+(i<deck.length?1:0),deck.length));if(i>=deck.length)done=deck.length;let p=Math.round(score/done*100);let ids=missed.map(m=>Q.findIndex(x=>x.q===m.q)).filter(x=>x>=0);localStorage.setItem('fost6003missed',JSON.stringify([...new Set(ids)]));result.innerHTML=`<div style="text-align:center;font-size:32px">${p>=90?'⭐⭐⭐':p>=75?'⭐⭐':'⭐'}</div><h2 style="text-align:center">Quest complete!</h2><p style="text-align:center"><b>${score}/${done}</b> correct • ${xp} XP</p>${missed.length?'<h3>Review these 💡</h3>'+missed.map(m=>`<div class="review"><b>${m.q}</b><br>✓ ${m.o[m.a]}<br><span class="tiny">${m.e}</span></div>`).join(''):'<p style="text-align:center">Perfect round! 🎉</p>'}<button class="primary" onclick="goHome()">Back to quests</button>`}function goHome(){result.classList.add('hidden');home.classList.remove('hidden')}if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
